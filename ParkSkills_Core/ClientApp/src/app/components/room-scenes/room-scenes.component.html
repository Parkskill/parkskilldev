<section>
  <!-- loading container -->
  <div *ngIf="loading" class="container-fluid">
    <spinner [loaderType]="'pageloader'"></spinner>
  </div>
</section>
<!-- Room scenes slider container -->
<section>
  <div *ngIf="!loading && routerUrl !== '/'&& newRoomScenes.length !== 0" class="text-center">
    <fancy-carousel [data]="newRoomScenes.rows"></fancy-carousel>
  </div>
</section>

<section>
  <div class="py-5 text-center container">
    <div
      *ngIf="!loading"
      class="row row-cols-1 row-cols-md-4 g-5 justify-content-center"
    >
    <!-- <p>Hey Count:{{ total_items}}</p> -->
     <div *ngFor="let item of newRoomScenes.rows | sort:'asc':'title'" class="col">
        <div class="card h-95">
          <img
            (click)="openDetails(item.rs_collection_category)"
            src="{{ item.thumbnail.replace('\/', '/') }}"
          />
          <p class="pt-2">{{item.title}}</p>
        </div>
      </div>
      <div class="paginationContainer mt-2 d-flex justify-content-center">
        <mat-paginator
        [length]="newRoomScenes?.pager?.total_items"
        [pageSize]="newRoomScenes?.pager?.items_per_page"
        (page)="handlePageEvent($event)"
        [hidePageSize]="true"
        [showFirstLastButtons]="true"
      >
      </mat-paginator>
      </div>
    </div>
  </div>
</section>
