<section *ngIf="!loading" class="py-5 text-center hero container-fluid">
  <img
    src="{{ getCatalogData[0].hero_image }}"
    alt="Background Image"
    class="background-image"
  />
  <div class="row py-lg-5">
    <div class="col-lg-6 col-md-8 mx-auto">
      <h1>{{ getCatalogData[0].title }}</h1>
      <p [innerHTML]="getCatalogData?.[0]?.summary"></p>
    </div>
  </div>
</section>
<section>
  <div class="py-5 text-center container">
    <div *ngIf="!catalogLoading" class="row row-cols-1 g-0 row-cols-lg-3">
      <div
        class="col catalogItem"
        *ngFor="let item of catalogList; let i = index"
      >
        <a class="" target="_blank" href="{{ item.field_catalogue_link }}"
          >{{ item.title }}
        </a>
      </div>
    </div>
  </div>
</section>
