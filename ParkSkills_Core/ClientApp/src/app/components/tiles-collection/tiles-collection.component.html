<section class="text-center container-fluid">
  <div *ngIf="loading" class="row g-3">
    <spinner [loaderType]="routerUrl !== '/' ? 'pageloader' : ''"></spinner>
  </div>
  <!-- Hero slider container -->
  <div *ngIf="!loading && routerUrl !== '/' && tilesCollection.length !== 0"  class="text-center">
    <fancy-carousel [data]="tilesCollection"></fancy-carousel>
  </div>

  <div *ngIf="!loading" 
  class='container text-center mt-5'
  >
    <!-- Default tile load -->
    <div *ngIf="routerUrl === '/'" class="row pb-5 text-center">
      <i class="bi bi-body-text"></i>
      <h1>VIEW OUR TILE COLLECTIONS</h1>
    </div>

    <div class="row row-cols-1 row-cols-md-4 g-0">
      <div
        class="col d-flex justify-content-center mb-4"
        *ngFor="let card of tilesCollection | sort : 'asc' : 'title'"
      >
        <div class="card">
          <img
            [src]="card.thumbnail"
            (click)="onRedirect(card)"
            class="card-img-top"
            alt="Card Image"
          />
          <div class="card-body">
            <h5 class="card-title">{{ card.title }}</h5>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
